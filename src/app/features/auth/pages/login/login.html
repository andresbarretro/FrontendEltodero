<div class="loginContainer" (click)="cerrar($event)">
  <div class="login">
    <h1>Iniciar sesión</h1>

    @if(!isLoggedIn) {
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">

        <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="usuario@correo.com">
      </div>

      <div class="form-group">

        <input id="password" name="password" type="password" [(ngModel)]="password" required placeholder="********">
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
  }

    <p class="success">Sesión activa como {{ email }}</p>
    <button (click)="logout()">Cerrar sesión</button>

  </div>
</div>
