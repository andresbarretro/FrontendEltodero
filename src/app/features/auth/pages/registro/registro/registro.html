<div class="Botones">
  <p>

  <mat-button-toggle-group [(ngModel)]="seleccionar" name="rol" aria-label="Seleccionar rol">
    <mat-button-toggle value="vendedor">Vendedor</mat-button-toggle>
    <mat-button-toggle value="comprador">Comprador</mat-button-toggle>

  </mat-button-toggle-group>
</p>
</div>

<div class="form-container">
  <div *ngIf="seleccionar === 'vendedor'">
    <h2>Registro como Vendedor</h2>
    <form>
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="number">Número de Teléfono:</label>
      <input type="number" id="telefono" name="telefono" required>

      <label for="text">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="text">Razon Social:</label>
      <input type="text" id="razonSocial" name="razonSocial" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <label for="confirmarPassword">Confirmar Contraseña:</label>
      <input type="password" id="confirmarPassword" name="confirmarPassword" required>

      <button class="Btn-registro" type="submit">Registrarse</button>
    </form>
  </div>

  <div *ngIf="seleccionar === 'comprador'">
    <h2>Registro como Comprador</h2>
    <form>
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <label for="confirmarPassword">Confirmar Contraseña:</label>
      <input type="password" id="confirmarPassword" name="confirmarPassword" required>

      <button class="Btn-registro" type="submit">Registrarse</button>
    </form>
  </div>
</div>
